name: "[v3] Build Self-Hosted PHP Binary (Unix)"

# Modes (resolved by the plan job):
#   verify  - every 3 days via cron: full rebuild, only to prove that the spc on the v3 branch still builds; nothing is uploaded
#   publish - every Sunday via cron, or manually: build only the (PHP version, platform) targets that are missing remotely, then publish incrementally
#
# Published artifacts are never overwritten:
#   rev 0 = php-<ver>-<sapi>-<suffix>.<ext>        (first publication, bare file name)
#   rev N = php-<ver>-N-<sapi>-<suffix>.<ext>      (forced republish, N increases monotonically)
# Metadata is written by the single writer in the publish job, so there is no read-modify-write race:
#   v3/php-bin/<combo>/versions.json
#   v3/php-bin/<combo>/version_<MM>.json
#   v3/php-bin/<combo>/README.txt

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "publish = incremental release / verify = build-only self check (no upload)"
        type: choice
        options:
          - publish
          - verify
        default: publish
      force:
        description: "In publish mode, force a republish of every target: revision + 1"
        type: boolean
        default: false
      label:
        description: "Optional note recorded in the metadata of a forced republish (e.g. openssl-cve-2026-1234)"
        type: string
        default: ""
  schedule:
    - cron: "0 1 */3 * *"   # verify: full build-only self check every 3 days
    - cron: "0 1 * * 0"     # publish: incremental release every Sunday (only does work when a new PHP patch appears)

concurrency:
  # Every run that can publish must share one group: a scheduled publish and a manual publish
  # would otherwise plan against the same remote state and allocate the same revision.
  # verify keeps its own group, so a long self-check never blocks a release.
  group: "v3-php-bin-unix-${{ (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 0') && 'publish' || inputs.mode || 'verify' }}"
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OSS_BASE: "https://dl.static-php.dev/v3/php-bin"
  PHP_MINORS: "8.2 8.3 8.4 8.5"
  WORKFLOW_KIND: unix

jobs:
  plan:
    name: "Plan"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      state: ${{ steps.plan.outputs.state }}
      mode: ${{ steps.plan.outputs.mode }}
      combinations: ${{ steps.plan.outputs.combinations }}
    steps:
      - name: "Checkout workflow repository"
        uses: actions/checkout@v4

      - name: "Resolve mode"
        id: mode
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "0 1 * * 0" ]; then MODE=publish; else MODE=verify; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "::notice::workflow mode: $MODE"

      - name: "Plan targets"
        id: plan
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          FORCE: ${{ inputs.force }}
        run: bash .github/scripts/php-bin-plan.sh

  build:
    name: "${{ matrix.combination }} ${{ matrix.php-version }} ${{ matrix.platform }} (rev ${{ matrix.revision }})"
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: "Checkout static-php-cli"
        uses: actions/checkout@v4
        with:
          repository: crazywhalecc/static-php-cli
          ref: v3

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: pecl, composer
          extensions: curl, openssl, mbstring, filter
          ini-values: memory_limit=-1

      - name: "Cache composer packages"
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php

      - name: "Cache downloaded artifacts"
        uses: actions/cache@v4
        with:
          path: downloads
          key: v3-php-bin-${{ matrix.combination }}-${{ matrix.php-version }}-${{ matrix.runner }}

      - name: "Install Dependencies"
        run: composer update -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-dev

      - name: "Apply target triple"
        if: matrix.spc-target != ''
        run: echo "SPC_TARGET=${{ matrix.spc-target }}" >> "$GITHUB_ENV"

      - name: "Run Build Tests (doctor)"
        run: bin/spc doctor --auto-fix

      - name: "Install UPX"
        if: contains(matrix.extra, 'with-upx-pack')
        run: bin/spc install-pkg upx

      - name: "Build PHP (extensions: ${{ matrix.combination }})"
        env:
          # Keep the SPC_ prefix: make(1) imports every environment variable as a Makefile
          # variable, and ICU's Makefile uses $(EXTRA) for extra subdirectories. Exporting a
          # plain EXTRA=--with-upx-pack made "make clean" try to cd into "--with-upx-pack"
          # and fail the icu build.
          SPC_EXTENSIONS: ${{ matrix.extensions }}
          SPC_EXTRA_ARGS: ${{ matrix.extra }}
          SPC_SUGGEST_ARGS: ${{ matrix.suggest }}
          SPC_PHP_PATCH: ${{ matrix.php-version }}
        run: |
          # spc exit code 75 = DOWNLOAD_ERROR; retry only on download errors, fail fast on build errors (72).
          # --dl-with-php takes the exact patch planned above (not just the minor line), so the
          # artifact name cannot drift when php.net publishes a new patch between plan and build.
          set +e
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            bin/spc build --build-cli --build-micro --build-fpm "$SPC_EXTENSIONS" --debug $SPC_EXTRA_ARGS $SPC_SUGGEST_ARGS               --dl-with-php="$SPC_PHP_PATCH" --dl-retry=5 --dl-prefer-binary --dl-ignore-cache=php-src
            code=$?
            if [ "$code" -eq 0 ]; then exit 0; fi
            echo "::warning::Build attempt ${attempt}/3 failed with exit code ${code}"
            if [ "$code" -ne 75 ]; then exit "$code"; fi
            sleep 30
          done
          exit 75

      - name: "Verify built PHP version matches the plan"
        env:
          SPC_PHP_PATCH: ${{ matrix.php-version }}
        run: |
          got=$(buildroot/bin/php -r 'echo PHP_VERSION;')
          if [ "$got" != "$SPC_PHP_PATCH" ]; then
            echo "::error::planned PHP $SPC_PHP_PATCH but the built binary reports $got"
            exit 1
          fi

      - name: "Smoke test built binaries"
        run: |
          buildroot/bin/php -v
          buildroot/bin/php -m | head -n 5
          buildroot/bin/php-fpm -v

      - name: "Pack archives"
        env:
          PHPVER: ${{ matrix.php-version }}
          REV: ${{ matrix.revision }}
          SFX: ${{ matrix.archive-suffix }}
        run: |
          set -euo pipefail
          mkdir -p tmp_dist dist
          cp buildroot/bin/php tmp_dist/
          cp buildroot/bin/micro.sfx tmp_dist/
          cp buildroot/bin/php-fpm tmp_dist/
          base="php-$PHPVER"
          if [ "$REV" -gt 0 ]; then base="$base-$REV"; fi
          for sapi in cli micro fpm; do
            case "$sapi" in
              cli) member=php ;;
              micro) member=micro.sfx ;;
              fpm) member=php-fpm ;;
            esac
            tar -czf "dist/$base-$sapi-$SFX.tar.gz" -C tmp_dist "$member"
          done
          ls -la dist

      - name: "Bundle licenses and build manifest"
        if: matrix.php-minor == '8.4' && matrix.platform == 'linux-x86_64'
        run: |
          set -euo pipefail
          cp -r buildroot/license dist/
          cp buildroot/build-manifest.json dist/

      - name: "Generate SHA-256 sidecars"
        run: |
          set -euo pipefail
          cd dist
          for archive in *.tar.gz; do
            printf '%s  %s\n' "$(sha256sum "$archive" | cut -d' ' -f1)" "$archive" > "$archive.sha256"
          done
          sha256sum -c --strict ./*.sha256

      - name: "Write build info"
        env:
          PHPVER: ${{ matrix.php-version }}
          SFX: ${{ matrix.archive-suffix }}
        run: |
          set -euo pipefail
          SPC_VERSION=$(bin/spc --version --no-ansi 2>/dev/null | tail -n1 | tr -d '\r')
          SPC_REF=$(git rev-parse --short HEAD)
          printf '{"spc-version":"%s","spc-ref":"v3@%s","built-at":"%s"}\n' \
            "$SPC_VERSION" "$SPC_REF" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "dist/info-$PHPVER-$SFX.json"

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: php-bin-${{ matrix.combination }}-${{ matrix.php-version }}-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

      - name: "Upload logs on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spc-logs-${{ matrix.combination }}-${{ matrix.php-version }}-${{ matrix.platform }}
          path: log/*.log
          if-no-files-found: ignore
          retention-days: 3

  publish:
    name: "Publish ${{ matrix.combination }}"
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        combination: ${{ fromJSON(needs.plan.outputs.combinations) }}
    steps:
      - name: "Checkout workflow repository"
        uses: actions/checkout@v4

      - name: "Download this combination's artifacts"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: php-bin-${{ matrix.combination }}-*
          path: stage
          merge-multiple: true

      - name: "Publish (verify, hash, metadata, upload)"
        env:
          COMBO: ${{ matrix.combination }}
          STATE: ${{ needs.plan.outputs.state }}
          LABEL: ${{ inputs.label }}
        run: bash .github/scripts/php-bin-publish.sh

      - name: "Deploy to self-hosted OSS"
        uses: static-php/upload-s3-action@v1.0.0
        with:
          aws_key_id: ${{ secrets.AWS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_bucket: ${{ secrets.AWS_BUCKET }}
          source_dir: "dist/"
          destination_dir: v3/php-bin/${{ matrix.combination }}/
          endpoint: ${{ secrets.AWS_ENDPOINT }}
