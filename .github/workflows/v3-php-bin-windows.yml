name: "[v3] Build Self-Hosted PHP Binary (Windows)"

# Same semantics and scripts as the unix workflow (plan/publish run on ubuntu, only build runs on windows):
#   verify  - every 3 days via cron: full build-only self check, nothing is uploaded
#   publish - every Sunday via cron or when dispatched: build only the targets that are missing remotely
# Artifacts: php-<ver>[-N]-<sapi>-win.zip (sapi = cli / micro)
# Metadata: v3/php-bin/<combo>/version_<MM>.json, versions.json, README.txt

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "publish = incremental release / verify = build-only self check (no upload)"
        type: choice
        options:
          - publish
          - verify
        default: publish
      force:
        description: "In publish mode, force a republish of every target: revision + 1"
        type: boolean
        default: false
      label:
        description: "Optional note recorded in the metadata of a forced republish"
        type: string
        default: ""
  schedule:
    - cron: "0 2 */3 * *"   # verify: full build-only self check every 3 days
    - cron: "0 2 * * 0"     # publish: incremental release every Sunday

concurrency:
  # Every run that can publish must share one group: a scheduled publish and a manual publish
  # would otherwise plan against the same remote state and allocate the same revision.
  # verify keeps its own group, so a long self-check never blocks a release.
  group: "v3-php-bin-windows-${{ (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 0') && 'publish' || inputs.mode || 'verify' }}"
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OSS_BASE: "https://dl.static-php.dev/v3/php-bin"
  PHP_MINORS: "8.2 8.3 8.4 8.5"
  WORKFLOW_KIND: windows

jobs:
  plan:
    name: "Plan"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      state: ${{ steps.plan.outputs.state }}
      mode: ${{ steps.plan.outputs.mode }}
      combinations: ${{ steps.plan.outputs.combinations }}
    steps:
      - name: "Checkout workflow repository"
        uses: actions/checkout@v4

      - name: "Resolve mode"
        id: mode
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "0 2 * * 0" ]; then MODE=publish; else MODE=verify; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "::notice::workflow mode: $MODE"

      - name: "Plan targets"
        id: plan
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          FORCE: ${{ inputs.force }}
        run: bash .github/scripts/php-bin-plan.sh

  build:
    name: "${{ matrix.combination }} ${{ matrix.php-version }} (rev ${{ matrix.revision }})"
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: "Checkout static-php-cli"
        uses: actions/checkout@v4
        with:
          repository: crazywhalecc/static-php-cli
          ref: v3

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: pecl, composer
          extensions: curl, openssl, mbstring, filter
          ini-values: memory_limit=-1

      - name: "Cache composer packages"
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php

      - name: "Cache downloaded artifacts"
        uses: actions/cache@v4
        with:
          path: downloads
          key: v3-php-bin-${{ matrix.combination }}-${{ matrix.php-version }}-${{ matrix.runner }}

      - name: "Install Dependencies"
        run: composer update -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-dev

      - name: "Validate SPC entrypoint"
        run: bin/spc --version

      - name: "Run Build Tests (doctor)"
        run: bin/spc doctor --auto-fix

      - name: "Install UPX"
        run: bin/spc install-pkg upx

      - name: "Build PHP (extensions: ${{ matrix.combination }})"
        shell: pwsh
        env:
          # SPC_ prefix: nmake/pwsh child processes inherit these names, so avoid plain
          # EXTRA/EXTENSIONS which may collide with a build system's own variables.
          SPC_EXTENSIONS: ${{ matrix.extensions }}
          SPC_EXTRA_ARGS: ${{ matrix.extra }}
          SPC_PHP_PATCH: ${{ matrix.php-version }}
        run: |
          # spc exit code 75 = DOWNLOAD_ERROR; retry only on download errors.
          # --dl-with-php takes the exact patch planned above, so the artifact name cannot
          # drift when php.net publishes a new patch between plan and build.
          $attempt = 0
          while ($true) {
            $attempt++
            Write-Host "Build attempt $attempt/3"
            & bin/spc build --build-cli --build-micro "$env:SPC_EXTENSIONS" --debug $env:SPC_EXTRA_ARGS --dl-with-php="$env:SPC_PHP_PATCH" --dl-retry=5
            $code = $LASTEXITCODE
            if ($code -eq 0) { exit 0 }
            Write-Host "::warning::Build attempt $attempt/3 failed with exit code $code"
            if ($code -ne 75 -or $attempt -ge 3) { exit $code }
            Start-Sleep -Seconds 30
          }

      - name: "Verify built PHP version matches the plan"
        shell: pwsh
        env:
          SPC_PHP_PATCH: ${{ matrix.php-version }}
        run: |
          $got = (& buildroot\bin\php.exe -r 'echo PHP_VERSION;').Trim()
          if ($got -ne $env:SPC_PHP_PATCH) {
            Write-Host "::error::planned PHP $env:SPC_PHP_PATCH but the built binary reports $got"
            exit 1
          }

      - name: "Smoke test built binaries"
        shell: pwsh
        run: |
          & buildroot\bin\php.exe -v
          & buildroot\bin\php.exe -m | Select-Object -First 5

      - name: "Pack archives"
        shell: pwsh
        env:
          PHPVER: ${{ matrix.php-version }}
          REV: ${{ matrix.revision }}
          SFX: ${{ matrix.archive-suffix }}
        run: |
          $PHPVER = $env:PHPVER
          $REV = [int]$env:REV
          $SFX = $env:SFX
          $base = "php-$PHPVER"
          if ($REV -gt 0) { $base = "$base-$REV" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "buildroot\bin\php.exe" -DestinationPath "dist\$base-cli-$SFX.zip" -Force
          Compress-Archive -Path "buildroot\bin\micro.sfx" -DestinationPath "dist\$base-micro-$SFX.zip" -Force
          Get-ChildItem dist | ForEach-Object { Write-Host $_.Name }

      - name: "Generate SHA-256 sidecars"
        shell: pwsh
        run: |
          foreach ($archive in @(Get-ChildItem -Path dist -Filter *.zip)) {
            $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLower()
            [System.IO.File]::WriteAllText(
              "$($archive.FullName).sha256",
              $hash + "  " + $archive.Name + [char]10,
              [System.Text.Encoding]::ASCII
            )
            Get-Content -LiteralPath "$($archive.FullName).sha256"
          }

      - name: "Write build info"
        shell: pwsh
        env:
          PHPVER: ${{ matrix.php-version }}
          SFX: ${{ matrix.archive-suffix }}
        run: |
          $spcVersion = (& bin/spc --version --no-ansi 2>$null | Select-Object -Last 1).Trim()
          $spcRef = (git rev-parse --short HEAD).Trim()
          $info = @{
            "spc-version" = $spcVersion
            "spc-ref" = "v3@$spcRef"
            "built-at" = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          $info | ConvertTo-Json -Compress | Set-Content -Path "dist\info-$env:PHPVER-$env:SFX.json" -Encoding ASCII

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: php-bin-${{ matrix.combination }}-${{ matrix.php-version }}-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

      - name: "Upload logs on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spc-logs-${{ matrix.combination }}-${{ matrix.php-version }}
          path: log/*.log
          if-no-files-found: ignore
          retention-days: 3

  publish:
    name: "Publish ${{ matrix.combination }}"
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        combination: ${{ fromJSON(needs.plan.outputs.combinations) }}
    steps:
      - name: "Checkout workflow repository"
        uses: actions/checkout@v4

      - name: "Download this combination's artifacts"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: php-bin-${{ matrix.combination }}-*
          path: stage
          merge-multiple: true

      - name: "Publish (verify, hash, metadata, upload)"
        env:
          COMBO: ${{ matrix.combination }}
          STATE: ${{ needs.plan.outputs.state }}
          LABEL: ${{ inputs.label }}
        run: bash .github/scripts/php-bin-publish.sh

      - name: "Deploy to self-hosted OSS"
        uses: static-php/upload-s3-action@v1.0.0
        with:
          aws_key_id: ${{ secrets.AWS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_bucket: ${{ secrets.AWS_BUCKET }}
          source_dir: "dist/"
          destination_dir: v3/php-bin/${{ matrix.combination }}/
          endpoint: ${{ secrets.AWS_ENDPOINT }}
